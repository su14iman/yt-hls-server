name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Only runtime dependencies ship in the image, so dev-only advisories
      # must not fail the build.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  # Proves the image still builds (and that the pinned yt-dlp asset exists)
  # without publishing anything.
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: yt-hls-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -eux
          docker run -d --name ci -p 8000:8000 yt-hls-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/ | grep -q OK
          # /healthz must report the bundled yt-dlp version.
          curl -fsS http://localhost:8000/healthz | tee /dev/stderr | grep -q '"version"'
          # The allowlist must reject a non-YouTube host.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://localhost:8000/hls_url?url=http://169.254.169.254/')
          test "$code" = "403"
          docker logs ci
          docker rm -f ci
